# Local development profile uses LocalStack instead of real AWS
spring.application.name=boxshare

# Logging handled by logback-spring.xml
spring.output.ansi.enabled=ALWAYS

# JWT — values defined in secrets.properties (imported via application.properties)

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Error responses — never expose stack traces or internal paths
spring.web.error.include-stacktrace=NEVER
spring.web.error.include-exception=false
spring.web.error.include-message=ALWAYS
spring.web.error.include-binding-errors=NEVER

# Flyway — baseline lets Flyway skip V1 on an existing DB and just track future changes
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Database (matches docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=zeta
spring.datasource.password=theta

# AWS (dummy creds for LocalStack)
aws.access.key=test
aws.secret.key=test
aws.region=us-east-1
aws.endpoint=http://localhost:4566
aws.s3.bucket=box-share-file-store
aws.queue.name=box-share-app-queue

# Spring Cloud AWS (SQS listener)
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.sqs.endpoint=http://localhost:4566

# Mail (Mailpit local catcher — see docker-compose.yaml)
spring.mail.host=localhost
spring.mail.port=1025
app.mail.from=noreply@boxshare.local
app.frontend-url=http://localhost:5173