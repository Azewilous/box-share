<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Monitor outer body -->
  <rect x="4" y="6" width="56" height="38" rx="5" ry="5" fill="#1a3a6b" stroke="#3a6a9a" stroke-width="2"/>

  <!-- Screen bezel (inner) -->
  <rect x="8" y="10" width="48" height="30" rx="3" ry="3" fill="#0a1220"/>

  <!-- Screen content: teal box wallpaper -->
  <rect x="10" y="12" width="44" height="26" rx="2" ry="2" fill="#0c6868"/>

  <!-- Wave lines on screen -->
  <line x1="10" y1="17" x2="54" y2="17" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="10" y1="22" x2="54" y2="22" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="10" y1="27" x2="54" y2="27" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Tiny slot grid (3x2) on screen -->
  <rect x="15" y="15" width="8" height="7" rx="1" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <rect x="25" y="15" width="8" height="7" rx="1" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <rect x="35" y="15" width="8" height="7" rx="1" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <rect x="15" y="24" width="8" height="7" rx="1" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <rect x="25" y="24" width="8" height="7" rx="1" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <!-- Highlighted slot (orange, like selected) -->
  <rect x="35" y="24" width="8" height="7" rx="1" fill="rgba(224,120,32,0.5)" stroke="#e07820" stroke-width="0.8"/>

  <!-- Monitor neck -->
  <rect x="28" y="44" width="8" height="5" rx="1" fill="#162540"/>

  <!-- Monitor base -->
  <rect x="18" y="49" width="28" height="5" rx="3" fill="#1a3a6b" stroke="#3a6a9a" stroke-width="1.5"/>

  <!-- Power LED -->
  <circle cx="50" cy="41" r="2" fill="#14a0a0"/>
</svg>
